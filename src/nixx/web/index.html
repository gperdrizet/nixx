<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>nixx</title>
  <link rel="manifest" href="/app/manifest.json">
  <meta name="theme-color" content="#0f0f1a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="nixx">
  <link rel="apple-touch-icon" href="/app/icon.svg">
  <script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f1a;
      --surface: #1a1a2e;
      --surface2: #16213e;
      --accent: #4f46e5;
      --text: #e2e8f0;
      --text-muted: #64748b;
      --user-bg: #1e293b;
      --asst-bg: #0f172a;
      --border: #2d2d4e;
      --green: #22c55e;
      --yellow: #eab308;
      --red: #ef4444;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 16px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
      max-width: 900px;
      margin: 0 auto;
    }

    /* ── Messages ── */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      -webkit-overflow-scrolling: touch;
    }

    .msg {
      padding: 0.75rem 1rem;
      border-radius: 0.5rem;
      word-break: break-word;
    }

    .msg.user {
      background: var(--user-bg);
      align-self: flex-end;
      max-width: 85%;
      white-space: pre-wrap;
    }

    .msg.assistant {
      background: var(--asst-bg);
      border: 1px solid var(--border);
    }

    .msg.system {
      color: var(--text-muted);
      font-size: 0.8rem;
      font-style: italic;
      text-align: center;
      padding: 0.25rem;
      background: none;
    }

    .msg.image {
      background: var(--asst-bg);
      border: 1px solid var(--border);
      padding: 0.5rem;
      max-width: 540px;
    }
    .msg.image img {
      display: block;
      max-width: 100%;
      border-radius: 0.375rem;
      margin-bottom: 0.4rem;
    }
    .msg.image .img-caption {
      font-size: 0.72rem;
      color: var(--text-muted);
      font-family: monospace;
      word-break: break-all;
    }

    /* markdown within assistant messages */
    .msg.assistant h1, .msg.assistant h2, .msg.assistant h3,
    .msg.assistant h4, .msg.assistant h5, .msg.assistant h6 {
      margin: 0.75em 0 0.35em;
      font-weight: 600;
      line-height: 1.25;
    }
    .msg.assistant h1 { font-size: 1.25em; }
    .msg.assistant h2 { font-size: 1.1em; }
    .msg.assistant h3 { font-size: 1em; }
    .msg.assistant p { margin-bottom: 0.6em; }
    .msg.assistant p:last-child { margin-bottom: 0; }
    .msg.assistant pre {
      background: #080812;
      border: 1px solid var(--border);
      border-radius: 0.375rem;
      padding: 0.75rem;
      overflow-x: auto;
      margin: 0.6em 0;
      font-size: 0.85em;
    }
    .msg.assistant code {
      font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
      font-size: 0.875em;
    }
    .msg.assistant pre code { background: none; padding: 0; }
    .msg.assistant :not(pre) > code {
      background: #1a1a3e;
      padding: 0.15em 0.35em;
      border-radius: 0.25em;
    }
    .msg.assistant ul, .msg.assistant ol {
      padding-left: 1.5em;
      margin-bottom: 0.6em;
    }
    .msg.assistant li { margin-bottom: 0.2em; }
    .msg.assistant li:last-child { margin-bottom: 0; }
    .msg.assistant blockquote {
      border-left: 3px solid var(--accent);
      padding: 0.25em 0 0.25em 0.75em;
      color: var(--text-muted);
      margin: 0.6em 0;
    }
    .msg.assistant table { border-collapse: collapse; width: 100%; margin: 0.6em 0; font-size: 0.9em; }
    .msg.assistant th, .msg.assistant td {
      border: 1px solid var(--border);
      padding: 0.35em 0.6em;
      text-align: left;
    }
    .msg.assistant th { background: var(--surface); font-weight: 600; }
    .msg.assistant a { color: var(--accent); text-decoration: underline; }
    .msg.assistant hr { border: none; border-top: 1px solid var(--border); margin: 0.75em 0; }
    .msg.assistant strong { font-weight: 600; }
    .msg.assistant em { font-style: italic; }

    .cursor { display: inline-block; width: 2px; height: 1em; background: var(--accent); margin-left: 1px; animation: blink 0.9s step-end infinite; vertical-align: text-bottom; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

    /* ── Tool approval card ── */
    #approval-card {
      display: none;
      margin: 0.5rem 1rem;
      padding: 1rem;
      background: var(--surface);
      border: 1px solid var(--accent);
      border-radius: 0.5rem;
      flex-shrink: 0;
    }
    #approval-card.visible { display: block; }
    #approval-card h4 { color: var(--accent); margin-bottom: 0.5rem; font-size: 0.9rem; font-weight: 600; }
    #approval-tools { margin-bottom: 0.5rem; display: flex; flex-wrap: wrap; gap: 0.25rem; }
    .tool-pill {
      background: var(--surface2);
      border: 1px solid var(--border);
      padding: 0.2em 0.55em;
      border-radius: 1em;
      font-size: 0.8rem;
      font-family: monospace;
      color: var(--text);
    }
    #approval-reasoning {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-bottom: 0.75rem;
      max-height: 100px;
      overflow-y: auto;
      white-space: pre-wrap;
      display: none;
      background: var(--bg);
      border-radius: 0.25rem;
      padding: 0.5rem;
    }
    #approval-buttons { display: flex; gap: 0.5rem; }
    #approve-btn {
      flex: 1;
      padding: 0.6rem;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 0.375rem;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
    }
    #approve-btn:active { opacity: 0.85; }
    #cancel-btn {
      flex: 1;
      padding: 0.6rem;
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 0.375rem;
      cursor: pointer;
      font-size: 0.9rem;
    }
    #cancel-btn:active { opacity: 0.75; }

    /* ── Crop modal ── */
    #crop-card {
      display: none;
      margin: 0.5rem 1rem;
      padding: 1rem;
      background: var(--surface);
      border: 1px solid var(--accent);
      border-radius: 0.5rem;
      flex-shrink: 0;
    }
    #crop-card.visible { display: block; }
    #crop-card h4 { color: var(--accent); margin-bottom: 0.5rem; font-size: 0.9rem; font-weight: 600; }
    #crop-hint { font-size: 0.78rem; color: var(--text-muted); margin-bottom: 0.75rem; }
    #crop-canvas-wrap { position: relative; width: 100%; touch-action: none; margin-bottom: 0.75rem; }
    #crop-canvas { display: block; width: 100%; height: auto; border-radius: 0.25rem; cursor: grab; }
    #crop-buttons { display: flex; gap: 0.5rem; }
    #crop-confirm-btn {
      flex: 1; padding: 0.6rem; background: var(--accent); color: white;
      border: none; border-radius: 0.375rem; cursor: pointer; font-size: 0.9rem; font-weight: 500;
    }
    #crop-cancel-btn {
      flex: 1; padding: 0.6rem; background: var(--surface2); color: var(--text);
      border: 1px solid var(--border); border-radius: 0.375rem; cursor: pointer; font-size: 0.9rem;
    }

    /* ── Status area ── */
    #status-area {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      padding: 0.3rem 1rem;
      border-top: 1px solid var(--border);
      font-size: 0.72rem;
      font-family: monospace;
      flex-shrink: 0;
      overflow: hidden;
    }
    .toggle-pill {
      background: none;
      border: none;
      padding: 0;
      font-size: 0.72rem;
      font-family: monospace;
      cursor: pointer;
      color: var(--green);
      -webkit-tap-highlight-color: transparent;
    }
    .toggle-pill.off { color: var(--text-muted); }
    #context-bar, #summary-bar { color: var(--text-muted); }
    .toggle-pill {
      background: none;
      border: none;
      padding: 0;
      font-size: 0.72rem;
      font-family: monospace;
      cursor: pointer;
      color: var(--green);
    }
    .toggle-pill.off { color: var(--text-muted); }

    /* ── Input area ── */
    #input-area {
      display: flex;
      gap: 0.5rem;
      padding: 0.6rem 1rem;
      padding-bottom: max(0.6rem, env(safe-area-inset-bottom));
      border-top: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
      align-items: flex-end;
    }
    #input {
      flex: 1;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      padding: 0.55rem 0.75rem;
      font-size: 1rem;
      font-family: inherit;
      resize: none;
      min-height: 42px;
      max-height: 140px;
      line-height: 1.45;
      -webkit-appearance: none;
    }
    #input:focus { outline: none; border-color: var(--accent); }
    #input::placeholder { color: var(--text-muted); }
    #send-btn {
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 0.5rem;
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      -webkit-tap-highlight-color: transparent;
    }
    #send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    #send-btn svg { width: 18px; height: 18px; }
    #mic-btn {
      background: none;
      color: var(--text-muted);
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      -webkit-tap-highlight-color: transparent;
      transition: color 0.15s, border-color 0.15s;
    }
    #mic-btn:hover { color: var(--accent); border-color: var(--accent); }
    #mic-btn.recording { color: var(--red); border-color: var(--red); animation: mic-pulse 1s ease-in-out infinite; }
    #mic-btn svg { width: 18px; height: 18px; }
    #mic-btn.unsupported { display: none; }
    @keyframes mic-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }

    /* ── Tab bar ── */
    #tab-bar {
      display: flex !important;
      border-top: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
      min-height: 44px;
      padding-bottom: env(safe-area-inset-bottom);
    }
    .tab-btn {
      flex: 1;
      padding: 0.5rem;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--text-muted);
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      letter-spacing: 0.03em;
      -webkit-tap-highlight-color: transparent;
    }
    .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

    /* ── Admin panel ── */
    #admin-panel {
      display: none;
      flex: 1;
      overflow: hidden;
    }
    #admin-panel.visible { display: flex; }
    #admin-frame {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* ── Files panel ── */
    #files-panel {
      display: none;
      flex: 1;
      flex-direction: column;
      overflow: hidden;
    }
    #files-panel.visible { display: flex; }
    #files-toolbar {
      padding: 0.5rem 1rem;
      border-bottom: 1px solid var(--border);
      font-size: 0.78rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    #files-path { flex: 1; font-family: monospace; }
    #files-refresh-btn {
      background: none; border: none; color: var(--accent);
      cursor: pointer; font-size: 0.8rem; padding: 0.2rem 0.4rem;
    }
    #files-list {
      flex: 1;
      overflow-y: auto;
      padding: 0.5rem 0;
    }
    .file-row {
      display: flex;
      align-items: center;
      padding: 0.55rem 1rem;
      gap: 0.75rem;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
    }
    .file-row:active { background: var(--surface2); }
    .file-icon { font-size: 1.1rem; flex-shrink: 0; }
    .file-info { flex: 1; min-width: 0; }
    .file-name {
      font-size: 0.9rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .file-meta { font-size: 0.72rem; color: var(--text-muted); margin-top: 0.1rem; }
    .file-actions { display: flex; gap: 0.35rem; flex-shrink: 0; }
    .file-dl-btn, .file-del-btn {
      padding: 0.25rem 0.5rem;
      border-radius: 0.3rem;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text);
      font-size: 0.75rem;
      cursor: pointer;
    }
    .file-dl-btn { color: var(--accent); }
    .file-del-btn { color: var(--red); }
    #files-empty {
      padding: 2rem 1rem;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <div id="app">

    <!-- Chat panel -->
    <div id="chat-panel" style="display:flex;flex-direction:column;flex:1;overflow:hidden;">
    <div id="messages"></div>

    <div id="approval-card">
      <h4>Tool use requested</h4>
      <div id="approval-tools"></div>
      <div id="approval-reasoning"></div>
      <div id="approval-buttons">
        <button id="approve-btn">Approve</button>
        <button id="cancel-btn">Cancel</button>
      </div>
    </div>

    <div id="crop-card">
      <h4>Crop image</h4>
      <div id="crop-hint">Drag to position the crop box, then confirm.</div>
      <div id="crop-canvas-wrap">
        <canvas id="crop-canvas"></canvas>
      </div>
      <div id="crop-buttons">
        <button id="crop-confirm-btn">Use this crop</button>
        <button id="crop-cancel-btn">Skip (auto-crop)</button>
      </div>
    </div>

    <div id="status-area">
      <button class="toggle-pill" id="recall-pill" title="Toggle recall">recall</button>
      <button class="toggle-pill" id="intent-pill" title="Toggle intent injection">intent</button>
      <span id="context-bar"></span>
      <span id="summary-bar"></span>
    </div>

    <div id="input-area">
      <textarea id="input" placeholder="Message nixx…" rows="1"></textarea></textarea>
      <button id="mic-btn" title="Voice input">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="23"/>
          <line x1="8" y1="23" x2="16" y2="23"/>
        </svg>
      </button>
      <button id="send-btn" title="Send">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
    </div>

    <!-- Admin panel -->
    <div id="admin-panel">
      <iframe id="admin-frame" title="Admin dashboard"></iframe>
    </div>

    <!-- Files panel -->
    <div id="files-panel">
      <div id="files-toolbar">
        <span id="files-path">scratch:/</span>
        <button id="files-refresh-btn" title="Refresh">↻ refresh</button>
      </div>
      <div id="files-list">
        <div id="files-empty">No files yet.</div>
      </div>
    </div>

    <div id="tab-bar">
      <button class="tab-btn active" data-tab="chat">chat</button>
      <button class="tab-btn" data-tab="files">files</button>
      <button class="tab-btn" data-tab="admin">admin</button>
    </div>
  </div>

  <script>
    // ── Configuration ──────────────────────────────────────────────────────────
    const API = window.location.origin;

    marked.setOptions({ breaks: true, gfm: true });

    // ── State ──────────────────────────────────────────────────────────────────
    let history = [];
    let streaming = false;
    let pendingToolCalls = null;
    let currentAssistantEl = null;
    let summaryInProgress = false;
    const activeImageJobs = new Map(); // job_id -> {path, intervalId}

    // ── DOM refs ───────────────────────────────────────────────────────────────
    const messagesEl    = document.getElementById('messages');
    const inputEl       = document.getElementById('input');
    const sendBtn       = document.getElementById('send-btn');
    const approvalCard  = document.getElementById('approval-card');
    const approvalTools = document.getElementById('approval-tools');
    const approvalReason= document.getElementById('approval-reasoning');
    const contextBarEl  = document.getElementById('context-bar');
    const summaryBarEl  = document.getElementById('summary-bar');
    const recallPill    = document.getElementById('recall-pill');
    const intentPill    = document.getElementById('intent-pill');

    // ── Message rendering ──────────────────────────────────────────────────────
    function addMessage(role, content = '') {
      const div = document.createElement('div');
      div.className = `msg ${role}`;
      if (role === 'assistant' && content) {
        div.innerHTML = marked.parse(content);
      } else {
        div.textContent = content;
      }
      messagesEl.appendChild(div);
      scrollToBottom();
      return div;
    }

    function addSystem(text) {
      return addMessage('system', text);
    }

    function scrollToBottom() {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    // ── Session restore ────────────────────────────────────────────────────────
    async function restoreSession() {
      try {
        const resp = await fetch(`${API}/v1/buffer/session`);
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const data = await resp.json();
        const entries = (data.entries || []).filter(e => e.role !== 'marker');
        if (entries.length > 0) {
          for (const e of entries) {
            history.push({ role: e.role, content: e.content });
            addMessage(e.role, e.content);
          }
          addSystem(`Restored ${entries.length} messages.`);
        } else {
          addSystem('New session. Type a message or /help for commands.');
        }
      } catch (err) {
        addSystem(`Could not connect to nixx server: ${err.message}`);
      }
    }

    // ── Status bars ────────────────────────────────────────────────────────────
    async function refreshContextBar() {
      try {
        const r = await fetch(`${API}/v1/debug/context`);
        if (!r.ok) return;
        const d = await r.json();
        const usage = d.token_usage || {};
        let prompt = usage.prompt_tokens || 0;
        let ctx = usage.context_length || 0;
        // Fallback: if no token_usage yet (server just started / no messages sent),
        // read context_length from /health so the bar shows 0% rather than nothing.
        if (ctx <= 0) {
          try {
            const hr = await fetch(`${API}/health`);
            if (hr.ok) {
              const hd = await hr.json();
              ctx = parseInt(hd.context_length || '0', 10);
            }
          } catch { /* ignore */ }
        }
        if (ctx <= 0) return;
        const pct = Math.min(prompt / ctx, 1.0);
        const filled = Math.round(pct * 20);
        const bar = '█'.repeat(filled) + '░'.repeat(20 - filled);
        const color = pct < 0.5 ? 'var(--green)' : pct < 0.8 ? 'var(--yellow)' : 'var(--red)';
        contextBarEl.innerHTML = `<span style="color:${color}">context ${Math.round(pct * 100)}%</span>`;
      } catch { /* non-fatal */ }
    }

    async function triggerAutoSummary() {
      if (summaryInProgress) return;
      summaryInProgress = true;
      try {
        const r = await fetch(`${API}/v1/episodic/summary`, { method: 'POST' });
        const d = await r.json();
        if (r.ok) {
          const tags = (d.tags || []).join(', ') || 'none';
          const entities = d.entities || {};
          const entityParts = Object.entries(entities)
            .filter(([, v]) => Array.isArray(v) && v.length)
            .map(([k, v]) => `${k}: ${v.join(', ')}`);
          const entityStr = entityParts.length ? entityParts.join('; ') : 'none';
          addSystem(
            `Summary created (buffer ${d.start_buffer_id}\u2013${d.end_buffer_id})\n` +
            `Tags: ${tags}\nEntities: ${entityStr}\n\n${d.content}`
          );
          await refreshStatus();
        }
      } catch { /* non-fatal */ } finally {
        summaryInProgress = false;
      }
    }

    async function refreshStatus() {
      try {
        const [intentResp, statusResp] = await Promise.all([
          fetch(`${API}/v1/intent`),
          fetch(`${API}/v1/episodic/status`),
        ]);
        if (intentResp.ok) { /* intent displayed via pill color */ }
        if (statusResp.ok) {
          const d = await statusResp.json();
          if (d.current_words != null && d.interval_words) {
            const pct = Math.min(d.current_words / d.interval_words, 1.0);
            const filled = Math.round(pct * 20);
            const bar = '█'.repeat(filled) + '░'.repeat(20 - filled);
            const color = pct < 0.5 ? 'var(--green)' : pct < 0.8 ? 'var(--yellow)' : 'var(--red)';
            summaryBarEl.innerHTML = `<span style="color:${color}">summary ${Math.round(pct * 100)}%</span>`;
          }
          updateTogglePills(d.recall_enabled !== false, d.intent_enabled !== false);
          if (d.summary_due && !summaryInProgress) {
            triggerAutoSummary();
          }
        }
      } catch { /* non-fatal */ }
    }

    // ── Streaming ──────────────────────────────────────────────────────────────
    async function streamResponse(assistantEl) {
      streaming = true;
      sendBtn.disabled = true;

      let accumulated = '';
      let approvalData = null;
      let cropNeededData = null;

      // Show blinking cursor
      const cursor = document.createElement('span');
      cursor.className = 'cursor';
      assistantEl.appendChild(cursor);

      try {
        const resp = await fetch(`${API}/v1/chat/completions`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages: history, stream: true }),
        });

        if (!resp.ok) {
          const err = await resp.json().catch(() => ({ error: { message: resp.statusText } }));
          cursor.remove();
          assistantEl.textContent = `Error: ${err?.error?.message || resp.statusText}`;
          setIdle();
          return;
        }

        const reader = resp.body.getReader();
        const decoder = new TextDecoder();
        let buf = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buf += decoder.decode(value, { stream: true });
          const lines = buf.split('\n');
          buf = lines.pop();

          for (const line of lines) {
            if (!line.startsWith('data: ')) continue;
            const raw = line.slice(6).trim();

            if (raw === '[DONE]') {
              cursor.remove();
              if (accumulated) {
                history.push({ role: 'assistant', content: accumulated });
                assistantEl.innerHTML = marked.parse(accumulated);
              } else if (!assistantEl.textContent.trim()) {
                assistantEl.remove();
              }
              await refreshStatus();
              refreshContextBar();
              setIdle();
              return;
            }

            if (raw === '[PAUSE]') {
              cursor.remove();
              if (cropNeededData) {
                showCrop(cropNeededData, assistantEl);
                cropNeededData = null;
              } else {
                showApproval(approvalData, assistantEl);
              }
              streaming = false;
              sendBtn.disabled = false;
              return;
            }

            let data;
            try { data = JSON.parse(raw); } catch { continue; }

            if (data.approval_needed) {
              approvalData = data.approval_needed;
              continue;
            }

            if (data.crop_needed) {
              cropNeededData = data.crop_needed;
              continue;
            }

            if (data.reset_accumulated) {
              accumulated = '';
              assistantEl.textContent = '';
              assistantEl.appendChild(cursor);
              continue;
            }

            if (data.image_job_started) {
              startPollingImageJob(data.image_job_started.job_id, data.image_job_started.path || '');
              continue;
            }

            if (data.verifying) {
              // Show a subtle indicator; will be replaced by real content
              if (!accumulated) {
                assistantEl.textContent = '';
                const verif = document.createElement('span');
                verif.style.color = 'var(--text-muted)';
                verif.style.fontStyle = 'italic';
                verif.textContent = 'verifying…';
                assistantEl.appendChild(verif);
                assistantEl.appendChild(cursor);
              }
              continue;
            }

            if (data.error) {
              cursor.remove();
              assistantEl.textContent = `Error: ${data.error.message}`;
              setIdle();
              return;
            }

            const content = data.choices?.[0]?.delta?.content;
            if (content) {
              accumulated += content;
              // Remove verifying placeholder if it's there
              const verif = assistantEl.querySelector('span[style*="italic"]');
              if (verif) verif.remove();
              // Show raw text during streaming; render markdown on [DONE]
              assistantEl.textContent = accumulated;
              assistantEl.appendChild(cursor);
              scrollToBottom();
            }
          }
        }
      } catch (err) {
        cursor.remove();
        assistantEl.textContent = `Error: ${err.message}`;
      }

      setIdle();
    }

    function setIdle() {
      streaming = false;
      sendBtn.disabled = false;
      inputEl.focus();
    }

    // ── Image job polling ──────────────────────────────────────────────────────
    function startPollingImageJob(jobId, path) {
      if (activeImageJobs.has(jobId)) return;
      const intervalId = setInterval(async () => {
        try {
          const r = await fetch(`${API}/v1/image/jobs`);
          if (!r.ok) return;
          const d = await r.json();
          const job = (d.jobs || []).find(j => j.job_id === jobId);
          if (!job) return;
          if (job.status === 'done') {
            clearInterval(intervalId);
            activeImageJobs.delete(jobId);
            const latency = job.latency_ms ? ` (${(job.latency_ms / 60000).toFixed(1)}m)` : '';
            // path is the absolute server-side path; derive a relative scratch path for download
            const relPath = path.replace(/.*nixx_scratch\//, '');
            const imgUrl = `${API}/v1/files/download?path=${encodeURIComponent(relPath)}`;
            const fname = path.split('/').pop();
            const div = document.createElement('div');
            div.className = 'msg image';
            div.innerHTML =
              `<img src="${imgUrl}" alt="generated image" loading="lazy" style="max-width:100%;border-radius:6px;">` +
              `<div class="img-caption">✓ Done${latency} · ${fname}</div>`;
            messagesEl.appendChild(div);
            scrollToBottom();
          } else if (job.status === 'error') {
            clearInterval(intervalId);
            activeImageJobs.delete(jobId);
            addSystem(`✗ Image job failed: ${job.error || jobId.slice(0, 8)}`);
          }
        } catch { /* non-fatal, try again next interval */ }
      }, 15000);
      activeImageJobs.set(jobId, { path, intervalId });
    }

    // ── Toggle pills ───────────────────────────────────────────────────────────
    function updateTogglePills(recallOn, intentOn) {
      recallPill.textContent = 'recall';
      recallPill.classList.toggle('off', !recallOn);
      intentPill.textContent = 'intent';
      intentPill.classList.toggle('off', !intentOn);
    }

    async function toggleRecall() {
      try {
        const r = await fetch(`${API}/v1/episodic/status`);
        const d = await r.json();
        const newVal = !d.recall_enabled;
        await fetch(`${API}/v1/episodic/config`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ recall_enabled: newVal }),
        });
        addSystem(`Recall ${newVal ? 'on' : 'off'}.`);
        updateTogglePills(newVal, intentPill.classList.contains('off') ? false : true);
      } catch { addSystem('Failed.'); }
    }

    async function toggleIntent() {
      try {
        const r = await fetch(`${API}/v1/episodic/status`);
        const d = await r.json();
        const newVal = !d.intent_enabled;
        await fetch(`${API}/v1/episodic/config`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ intent_enabled: newVal }),
        });
        addSystem(`Intent injection ${newVal ? 'on' : 'off'}.`);
        updateTogglePills(recallPill.classList.contains('off') ? false : true, newVal);
      } catch { addSystem('Failed.'); }
    }

    recallPill.addEventListener('click', toggleRecall);
    intentPill.addEventListener('click', toggleIntent);

    // ── Tool approval ──────────────────────────────────────────────────────────
    function showApproval(data, assistantEl) {
      if (!data) return;
      pendingToolCalls = data.tool_calls;
      currentAssistantEl = assistantEl;

      approvalTools.innerHTML = (data.tools || [])
        .map(t => `<span class="tool-pill">${t}</span>`)
        .join('');

      const reasoning = (data.reasoning || '').replace(/<\/?think>/gi, '').trim();
      if (reasoning) {
        approvalReason.textContent = reasoning.slice(0, 600) + (reasoning.length > 600 ? '…' : '');
        approvalReason.style.display = 'block';
      } else {
        approvalReason.style.display = 'none';
      }

      approvalCard.classList.add('visible');
      approvalCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function hideApproval() {
      approvalCard.classList.remove('visible');
      pendingToolCalls = null;
    }

    async function approveTools() {
      if (!pendingToolCalls) return;
      const toolCalls = pendingToolCalls;
      const assistantEl = currentAssistantEl;
      hideApproval();
      history.push({ role: 'assistant', content: '', tool_calls: toolCalls });
      if (assistantEl) {
        assistantEl.textContent = '';
      }
      await streamResponse(assistantEl || addMessage('assistant'));
    }

    function cancelTools() {
      hideApproval();
      // Pop the user message from history
      if (history.length && history[history.length - 1].role === 'user') {
        history.pop();
      }
      // Remove the last user + assistant bubbles from DOM
      const bubbles = messagesEl.querySelectorAll('.msg.user, .msg.assistant');
      const len = bubbles.length;
      if (len >= 2) { bubbles[len - 1].remove(); bubbles[len - 2].remove(); }
      else if (len === 1) { bubbles[0].remove(); }
      addSystem('Tool use cancelled.');
      inputEl.focus();
    }

    // ── Crop UI ───────────────────────────────────────────────────────────────
    const cropCard    = document.getElementById('crop-card');
    const cropCanvas  = document.getElementById('crop-canvas');
    let cropData      = null;   // {path, width, height, tool_calls}
    let cropImg       = null;   // HTMLImageElement
    let cropBoxY      = 0;      // top-left of square in image pixels (dimension constrained axis)
    let cropBoxX      = 0;
    let cropSize      = 0;      // side length in image pixels
    let cropDragStart = null;   // {clientX, clientY, boxX, boxY}

    function showCrop(data, assistantEl) {
      cropData = data;
      currentAssistantEl = assistantEl;
      const { path, width, height } = data;
      cropSize = Math.min(width, height);
      cropBoxX = width  > height ? Math.round((width  - cropSize) / 2) : 0;
      cropBoxY = height > width  ? Math.round((height - cropSize) / 2) : 0;

      cropImg = new Image();
      cropImg.onload = () => drawCrop();
      cropImg.src = `${API}/v1/image/preview?path=${encodeURIComponent(path)}`;

      cropCard.classList.add('visible');
      cropCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function hideCrop() {
      cropCard.classList.remove('visible');
      cropData = null;
      cropImg  = null;
    }

    function drawCrop() {
      if (!cropImg) return;
      const { width, height } = cropData;
      // Scale canvas to display width
      const displayW = cropCanvas.parentElement.clientWidth || 320;
      const scale    = displayW / width;
      cropCanvas.width  = displayW;
      cropCanvas.height = Math.round(height * scale);
      const ctx = cropCanvas.getContext('2d');
      ctx.drawImage(cropImg, 0, 0, displayW, cropCanvas.height);
      // Dim outside crop box
      const bx = cropBoxX * scale, by = cropBoxY * scale, bs = cropSize * scale;
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fillRect(0, 0, displayW, by);                           // top
      ctx.fillRect(0, by + bs, displayW, cropCanvas.height - by - bs); // bottom
      ctx.fillRect(0, by, bx, bs);                               // left
      ctx.fillRect(bx + bs, by, displayW - bx - bs, bs);          // right
      // Crop box border
      ctx.strokeStyle = 'rgba(255,255,255,0.9)';
      ctx.lineWidth = 2;
      ctx.strokeRect(bx, by, bs, bs);
      // Rule-of-thirds grid
      ctx.strokeStyle = 'rgba(255,255,255,0.25)';
      ctx.lineWidth = 1;
      for (let i = 1; i < 3; i++) {
        ctx.beginPath(); ctx.moveTo(bx + bs*i/3, by); ctx.lineTo(bx + bs*i/3, by+bs); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(bx, by + bs*i/3); ctx.lineTo(bx+bs, by + bs*i/3); ctx.stroke();
      }
    }

    function cropPointerStart(e) {
      const pt = e.touches ? e.touches[0] : e;
      cropDragStart = { clientX: pt.clientX, clientY: pt.clientY, boxX: cropBoxX, boxY: cropBoxY };
      cropCanvas.style.cursor = 'grabbing';
      e.preventDefault();
    }
    function cropPointerMove(e) {
      if (!cropDragStart) return;
      const pt = e.touches ? e.touches[0] : e;
      const { width, height } = cropData;
      const scale = (cropCanvas.parentElement.clientWidth || 320) / width;
      const dx = (pt.clientX - cropDragStart.clientX) / scale;
      const dy = (pt.clientY - cropDragStart.clientY) / scale;
      cropBoxX = Math.max(0, Math.min(width  - cropSize, Math.round(cropDragStart.boxX + dx)));
      cropBoxY = Math.max(0, Math.min(height - cropSize, Math.round(cropDragStart.boxY + dy)));
      drawCrop();
      e.preventDefault();
    }
    function cropPointerEnd() {
      cropDragStart = null;
      cropCanvas.style.cursor = 'grab';
    }

    cropCanvas.addEventListener('mousedown',  cropPointerStart, { passive: false });
    cropCanvas.addEventListener('mousemove',  cropPointerMove,  { passive: false });
    cropCanvas.addEventListener('mouseup',    cropPointerEnd);
    cropCanvas.addEventListener('touchstart', cropPointerStart, { passive: false });
    cropCanvas.addEventListener('touchmove',  cropPointerMove,  { passive: false });
    cropCanvas.addEventListener('touchend',   cropPointerEnd);

    document.getElementById('crop-confirm-btn').addEventListener('click', async () => {
      if (!cropData) return;
      const toolCalls = cropData.tool_calls;
      const assistantEl = currentAssistantEl;
      // Pre-crop the image server-side
      let croppedPath = cropData.path;
      try {
        const r = await fetch(`${API}/v1/image/crop`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ path: cropData.path, x: cropBoxX, y: cropBoxY, size: cropSize }),
        });
        if (r.ok) croppedPath = (await r.json()).cropped_path;
      } catch { /* use original path if crop fails */ }
      hideCrop();
      // Patch input_path in the edit_image tool call
      const patchedCalls = toolCalls.map(tc => {
        if (tc.function.name === 'edit_image') {
          const args = typeof tc.function.arguments === 'string'
            ? JSON.parse(tc.function.arguments) : { ...tc.function.arguments };
          args.input_path = croppedPath;
          return { ...tc, function: { ...tc.function, arguments: JSON.stringify(args) } };
        }
        return tc;
      });
      history.push({ role: 'assistant', content: '', tool_calls: patchedCalls });
      if (assistantEl) assistantEl.textContent = '';
      await streamResponse(assistantEl || addMessage('assistant'));
    });

    document.getElementById('crop-cancel-btn').addEventListener('click', async () => {
      if (!cropData) return;
      const toolCalls = cropData.tool_calls;
      const assistantEl = currentAssistantEl;
      hideCrop();
      // Resume with original tool calls (diffusers will auto-crop)
      history.push({ role: 'assistant', content: '', tool_calls: toolCalls });
      if (assistantEl) assistantEl.textContent = '';
      await streamResponse(assistantEl || addMessage('assistant'));
    });


    // ── Slash commands ─────────────────────────────────────────────────────────
    async function handleCommand(text) {
      const parts = text.slice(1).split(' ');
      const cmd = parts[0].toLowerCase();
      const arg = parts.slice(1).join(' ').trim();

      if (cmd === 'help') {
        addSystem(
          'Commands: /clear /summary /search "query" /context /recall /intent-toggle /intent [text|clear] /project [dir|clear] /threshold [0.0-1.0] /interval [n] /gen-model [sd14|sd21|sdxl|turbo]'
        );
      } else if (cmd === 'clear') {
        history = [];
        messagesEl.innerHTML = '';
        await fetch(`${API}/v1/buffer/clear`, { method: 'POST' });
        addSystem('Conversation cleared.');
        await refreshStatus();
      } else if (cmd === 'summary') {
        try {
          const r = await fetch(`${API}/v1/episodic/summary`, { method: 'POST' });
          const d = await r.json();
          addSystem(r.ok ? `Summary created (id ${d.id}).` : `Summary failed: ${d.detail}`);
          await refreshStatus();
        } catch { addSystem('Summary failed.'); }
      } else if (cmd === 'search') {
        const query = arg.replace(/^["']|["']$/g, '');
        if (!query) { addSystem('Usage: /search "query"'); return; }
        try {
          const r = await fetch(`${API}/v1/episodic/search`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ query, top_k: 5 }),
          });
          const d = await r.json();
          if (!d.results?.length) { addSystem('No results found.'); return; }
          const out = d.results.map(r => `[${r.role}] ${r.content.slice(0, 200)}`).join('\n\n');
          addMessage('system', out);
        } catch { addSystem('Search failed.'); }
      } else if (cmd === 'context') {
        try {
          const r = await fetch(`${API}/v1/debug/context`);
          const d = await r.json();
          const preview = (d.system_prompt || '').slice(0, 800);
          addSystem(`System prompt (first 800 chars):\n\n${preview}`);
        } catch { addSystem('Failed to fetch context.'); }
      } else if (cmd === 'recall') {
        await toggleRecall();
      } else if (cmd === 'intent-toggle') {
        await toggleIntent();
      } else if (cmd === 'intent') {
        if (!arg) {
          try {
            const r = await fetch(`${API}/v1/intent`);
            const d = await r.json();
            addSystem(`Current intent: ${d.intent || '(none)'}`);
          } catch { addSystem('Failed.'); }
        } else if (arg.toLowerCase() === 'clear') {
          await fetch(`${API}/v1/intent`, { method: 'DELETE' });
          addSystem('Intent cleared.');
          await refreshStatus();
        } else {
          await fetch(`${API}/v1/intent`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ intent: arg }),
          });
          addSystem(`Intent set.`);
          await refreshStatus();
        }
      } else if (cmd === 'project') {
        if (!arg) {
          try {
            const r = await fetch(`${API}/v1/project`);
            const d = await r.json();
            addSystem(`Project directory: ${d.project_dir || '(none)'}\nScratch directory: ${d.scratch_dir}`);
          } catch { addSystem('Failed.'); }
        } else if (arg.toLowerCase() === 'clear') {
          await fetch(`${API}/v1/project`, { method: 'DELETE' });
          addSystem('Project directory cleared.');
        } else {
          try {
            const r = await fetch(`${API}/v1/project`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ directory: arg }),
            });
            if (r.ok) addSystem(`Project directory set to: ${arg}`);
            else { const d = await r.json(); addSystem(`Error: ${d.detail}`); }
          } catch { addSystem('Failed.'); }
        }
      } else if (cmd === 'threshold') {
        if (!arg) {
          const r = await fetch(`${API}/v1/episodic/status`);
          const d = await r.json();
          addSystem(`Recall threshold: ${d.recall_threshold}`);
        } else {
          await fetch(`${API}/v1/episodic/config`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ recall_threshold: parseFloat(arg) }),
          });
          addSystem(`Threshold set to ${arg}.`);
        }
      } else if (cmd === 'interval') {
        if (!arg) {
          const r = await fetch(`${API}/v1/episodic/status`);
          const d = await r.json();
          addSystem(`Summary interval: ${d.interval_words} words`);
        } else {
          await fetch(`${API}/v1/episodic/config`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ interval_words: parseInt(arg) }),
          });
          addSystem(`Interval set to ${arg} words.`);
        }
      } else if (cmd === 'gen-model') {
        const aliases = { sd14: 'sd14', sd21: 'sd21', sdxl: 'sdxl', turbo: 'sdxl_turbo', 'sdxl-turbo': 'sdxl_turbo', sdxl_turbo: 'sdxl_turbo' };
        const labels  = { sd14: 'SD 1.4 (GPU, ~2 GiB)', sd21: 'SD 2.1 Base (GPU, ~3.5 GiB)', sdxl: 'SDXL (model offload, ~6.9 GiB)', sdxl_turbo: 'SDXL Turbo (model offload, ~6.9 GiB, 4-step)' };
        if (!arg) {
          try {
            const r = await fetch(`${API}/v1/image/generate-model`);
            const d = await r.json();
            addSystem(`Image generate model: ${labels[d.model] || d.model}\nSwitch with /gen-model [sd14|sd21|sdxl|turbo]`);
          } catch { addSystem('nixx-image not running.'); }
        } else {
          const model = aliases[arg.toLowerCase()];
          if (!model) {
            addSystem('Usage: /gen-model [sd14|sd21|sdxl|turbo]');
          } else {
            try {
              const r = await fetch(`${API}/v1/image/generate-model`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ model }),
              });
              const d = await r.json();
              if (!r.ok) { addSystem(`Failed to set generate model: ${d.detail || r.status}`); }
              else { addSystem(`Image generate model set to: ${labels[d.model] || d.model}`); }
            } catch { addSystem('Failed to set image generate model.'); }
          }
        }
      } else {
        addSystem(`Unknown command: /${cmd}. Try /help.`);
      }
      inputEl.focus();
    }

    // ── Tab switching ──────────────────────────────────────────────────────────
    const chatPanel  = document.getElementById('chat-panel');
    const filesPanel = document.getElementById('files-panel');
    const adminPanel = document.getElementById('admin-panel');
    const adminFrame = document.getElementById('admin-frame');
    let currentDir = '';

    document.getElementById('tab-bar').addEventListener('click', e => {
      const btn = e.target.closest('.tab-btn');
      if (!btn) return;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const tab = btn.dataset.tab;
      chatPanel.style.display  = tab === 'chat'  ? 'flex' : 'none';
      filesPanel.classList.toggle('visible', tab === 'files');
      adminPanel.classList.toggle('visible', tab === 'admin');
      if (tab === 'files') loadFiles('');
      if (tab === 'admin' && !adminFrame.dataset.loaded) {
        adminFrame.src = '/admin';
        adminFrame.dataset.loaded = '1';
      }
    });

    // ── File browser ───────────────────────────────────────────────────────────
    function formatSize(bytes) {
      if (bytes < 1024) return `${bytes} B`;
      if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
      return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
    }

    function formatDate(ts) {
      return new Date(ts * 1000).toLocaleDateString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    async function loadFiles(subdir) {
      currentDir = subdir;
      const pathEl = document.getElementById('files-path');
      const listEl = document.getElementById('files-list');
      pathEl.textContent = `scratch:/${subdir}`;
      listEl.innerHTML = '<div id="files-empty" style="padding:2rem;text-align:center;color:var(--text-muted)">Loading…</div>';

      try {
        const url = subdir ? `${API}/v1/files?subdir=${encodeURIComponent(subdir)}` : `${API}/v1/files`;
        const resp = await fetch(url);
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const data = await resp.json();

        listEl.innerHTML = '';

        if (subdir) {
          const upRow = document.createElement('div');
          upRow.className = 'file-row';
          upRow.innerHTML = `<span class="file-icon">📁</span><span class="file-name">.. (up)</span>`;
          upRow.addEventListener('click', () => {
            const parts = subdir.split('/').filter(Boolean);
            parts.pop();
            loadFiles(parts.join('/'));
          });
          listEl.appendChild(upRow);
        }

        if (!data.entries.length && !subdir) {
          listEl.innerHTML = '<div id="files-empty" style="padding:2rem;text-align:center;color:var(--text-muted)">Scratch directory is empty.</div>';
          return;
        }

        for (const entry of data.entries) {
          const row = document.createElement('div');
          row.className = 'file-row';

          const icon = entry.is_dir ? '📁' : '📄';
          const meta = entry.is_dir ? '' : `${formatSize(entry.size)} · ${formatDate(entry.modified)}`;

          row.innerHTML = `
            <span class="file-icon">${icon}</span>
            <div class="file-info">
              <div class="file-name">${entry.name}</div>
              ${meta ? `<div class="file-meta">${meta}</div>` : ''}
            </div>
            <div class="file-actions">
              ${entry.is_dir ? '' : `<button class="file-dl-btn" data-path="${entry.path}">↓</button>`}
              ${entry.is_dir ? '' : `<button class="file-del-btn" data-path="${entry.path}">✕</button>`}
            </div>
          `;

          if (entry.is_dir) {
            row.addEventListener('click', () => loadFiles(entry.path));
          } else {
            row.querySelector('.file-dl-btn')?.addEventListener('click', e => {
              e.stopPropagation();
              window.location.href = `${API}/v1/files/download?path=${encodeURIComponent(entry.path)}`;
            });
            row.querySelector('.file-del-btn')?.addEventListener('click', async e => {
              e.stopPropagation();
              if (!confirm(`Delete ${entry.name}?`)) return;
              await fetch(`${API}/v1/files?path=${encodeURIComponent(entry.path)}`, { method: 'DELETE' });
              loadFiles(currentDir);
            });
          }

          listEl.appendChild(row);
        }
      } catch (err) {
        listEl.innerHTML = `<div style="padding:2rem;text-align:center;color:var(--red)">Error: ${err.message}</div>`;
      }
    }

    document.getElementById('files-refresh-btn').addEventListener('click', () => loadFiles(currentDir));

    // ── Send ───────────────────────────────────────────────────────────────────
    async function send() {
      const text = inputEl.value.trim();
      if (!text || streaming) return;

      inputEl.value = '';
      autoResize();

      if (text.startsWith('/')) {
        await handleCommand(text);
        return;
      }

      history.push({ role: 'user', content: text });
      addMessage('user', text);
      const assistantEl = addMessage('assistant', '');
      currentAssistantEl = assistantEl;
      await streamResponse(assistantEl);
    }

    // ── Input auto-resize ──────────────────────────────────────────────────────
    function autoResize() {
      inputEl.style.height = 'auto';
      inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + 'px';
    }

    // ── Event listeners ────────────────────────────────────────────────────────
    sendBtn.addEventListener('click', send);
    document.getElementById('approve-btn').addEventListener('click', approveTools);
    document.getElementById('cancel-btn').addEventListener('click', cancelTools);

    inputEl.addEventListener('input', autoResize);
    inputEl.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    });

    // ── Speech input ───────────────────────────────────────────────────────────
    const micBtn = document.getElementById('mic-btn');
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
      micBtn.classList.add('unsupported');
    } else {
      const recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.lang = 'en-US';
      let isRecording = false;
      let textBeforeSpeech = '';

      recognition.onstart = () => {
        isRecording = true;
        micBtn.classList.add('recording');
        textBeforeSpeech = inputEl.value;
      };

      recognition.onresult = e => {
        const transcript = Array.from(e.results)
          .map(r => r[0].transcript)
          .join('');
        inputEl.value = textBeforeSpeech + (textBeforeSpeech && !textBeforeSpeech.endsWith(' ') ? ' ' : '') + transcript;
        autoResize();
      };

      recognition.onend = () => {
        // In continuous mode onend only fires on explicit stop or error
        isRecording = false;
        micBtn.classList.remove('recording');
        inputEl.focus();
      };

      recognition.onerror = e => {
        isRecording = false;
        micBtn.classList.remove('recording');
        if (e.error !== 'aborted') addSystem(`Speech error: ${e.error}`);
      };

      micBtn.addEventListener('click', () => {
        if (isRecording) {
          recognition.stop();
        } else {
          try { recognition.start(); } catch { /* already started */ }
        }
      });
    }

    // Service worker registration
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/app/sw.js', { scope: '/app/' }).catch(() => {});
    }

    // ── Init ───────────────────────────────────────────────────────────────────
    (async () => {
      // Ensure tab bar is visible regardless of any paint-order quirk
      document.getElementById('tab-bar').style.display = 'flex';
      await restoreSession();
      await refreshStatus();
      refreshContextBar();
      inputEl.focus();
    })();
  </script>
</body>
</html>
